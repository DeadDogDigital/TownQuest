/* Game-first HUD: the World view is the game, not a web page. */

body.in-game .top{position:fixed;top:0;left:0;right:0;padding:10px 14px;background:linear-gradient(#09100ddd,transparent);box-shadow:none;pointer-events:none;z-index:1000}

.game-screen .world-shell{position:absolute;inset:0;margin:0;border-radius:0;box-shadow:none;background:#18231e}

.game-topbar{position:absolute;top:54px;left:14px;right:14px;z-index:700;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.game-status,.game-locate{pointer-events:auto;background:#0c1511d9;color:#fff;border:1px solid #ffffff1c;box-shadow:0 5px 18px #0004;backdrop-filter:blur(9px)}
.game-status{border-radius:999px;padding:8px 12px;font-size:12px;font-weight:750;display:flex;align-items:center;gap:7px;max-width:75%}
.status-dot{width:7px;height:7px;border-radius:50%;background:#d6a83d;box-shadow:0 0 9px #d6a83d;animation:glow 1.5s infinite alternate}
.game-locate{width:40px;height:40px;border-radius:50%;font-size:22px;display:grid;place-items:center}
.story-modal{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:24px;background:#020604cc;backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .25s ease}.story-modal.show{opacity:1;pointer-events:auto}.story-modal-inner{width:min(520px,100%);padding:28px 22px 22px;border:1px solid #d6a83d66;border-radius:22px;background:#0b1510f5;color:#fff;box-shadow:0 20px 70px #0009;text-align:center;transform:translateY(10px) scale(.98);transition:transform .25s ease}.story-modal.show .story-modal-inner{transform:translateY(0) scale(1)}.story-modal-text{font-family:Georgia,serif;font-size:clamp(22px,6vw,34px);line-height:1.25;margin:18px 0 24px}.story-modal-button{min-width:150px;margin:0 auto}..game-screen .world-hud{left:14px;right:14px;bottom:74px}

3)}100%{filter:brightness(1)}}
